name: Check and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested version as a stable release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PHP syntax and access boundaries
        run: |
          php -v
          php -r 'exit(PHP_VERSION_ID >= 80300 && PHP_VERSION_ID < 80400 ? 0 : 1);' 
          find . -path ./.git -prune -o -name '*.php' -type f -print0 | xargs -0 -n 1 php -l
          php tests/configuration-boundary.php
          php tests/updates.php
          php tests/integrations.php
          php tests/adapter-setup.php
          php tests/rocket-notice.php
          php tests/generatepress-setup.php
          php tests/defaults.php
          php tests/status.php
          node --check assets/setup.js
          node tests/setup-client.js
      - name: Check changed PHP files against WordPress Core standards
        run: |
          coding_dir="$RUNNER_TEMP/connector-coding"
          mkdir -p "$coding_dir"
          composer require --working-dir="$coding_dir" --dev --no-interaction --no-plugins --no-scripts --prefer-dist wp-coding-standards/wpcs
          composer show --no-plugins --working-dir="$coding_dir" --format=json
          "$coding_dir/vendor/bin/phpcs" --runtime-set installed_paths "$coding_dir/vendor/wp-coding-standards/wpcs,$coding_dir/vendor/phpcsstandards/phpcsutils,$coding_dir/vendor/phpcsstandards/phpcsextra" --standard=WordPress-Core church-website-connector.php includes/admin.php includes/adapter-setup.php includes/updates.php includes/maintenance.php includes/generatepress-setup.php includes/defaults.php includes/status.php includes/generatepress-bridge.php includes/configuration.php uninstall.php
      - name: Build distributable package
        run: python3 scripts/build.py

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: connector-stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/build.py
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py
