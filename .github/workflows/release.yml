name: Check and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested version as a stable release
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PHP syntax and access boundaries
        run: |
          php -v
          find . -path ./.git -prune -o -name '*.php' -type f -print0 | xargs -0 -n 1 php -l
          php tests/updates.php
          php tests/integrations.php
      - name: Build distributable package
        run: python3 scripts/build.py

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: connector-stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/build.py
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py
